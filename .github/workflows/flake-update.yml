name: Flake Update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: flake-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.24.1
        with:
          github-token: ${{ secrets.CALAGOPUS_READ_TOKEN || github.token }}

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@v28
        with:
          branch: ci/update-flake-lock
          commit-msg: "chore: update flake.lock"
          pr-title: "chore: update flake inputs"